inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  dagger:
    url: github:dagger/nix
    inputs:
      nixpkgs:
        follows: nixpkgs

# gcloud is unfree. Permit that package only.
nixpkgs:
  permitted_unfree_packages:
    - google-cloud-sdk
